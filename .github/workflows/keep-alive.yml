name: Keep backend warm

# Render's free tier spins the service down after ~15 minutes of no traffic;
# the next real visitor then eats a 30-60s cold-start delay that looks like
# the site is broken. Pinging /api/health well inside that window keeps the
# instance warm around the clock instead.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 30 https://happend-backend.onrender.com/api/health
